name: Capture retry clock tests and inputs
on:
  push:
    branches: ['audit/capture-retry-schedule-20261019']
    paths: ['.github/workflows/capture-retry-inputs.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out public source without initializing submodules
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/skyking882/missile_sim.git
          git -c submodule.recurse=false fetch --depth=1 origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run isolated clock contracts
        run: |
          set -euo pipefail
          mkdir receipts
          python3 audits/capture_retry_20261019/test_retry_clock.py 2>&1 | tee receipts/tests.log
          git rev-parse HEAD > receipts/source-commit.txt
      - name: Restore completed source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39141115762 --repo skyking882/missile_sim --name missile-sim-offaxis-state-reviewed-20261018 --dir previous
          gh run download 39055559128 --repo skyking882/missile_sim --name psvs-linux-derived-9f28aeb --dir derived
          gh run download 39055471867 --repo skyking882/missile_sim --name psvs-frozen-decoder-reference-2dc243b --dir reference
      - name: Verify and select bounded input files
        run: python3 audits/capture_retry_20261019/prepare_inputs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capture-retry-inputs-20261019
          path: |
            bounded/
            receipts/
            audits/capture_retry_20261019/
          retention-days: 14
          compression-level: 1
