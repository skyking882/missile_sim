name: Relock mechanism final delivery
on:
  push:
    branches: ['audit/relock-timing-paths-20261019']
    paths: ['.github/workflows/relock-mechanism-delivery.yml']
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact public source, no submodules
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/skyking882/missile_sim.git
          git -c submodule.recurse=false fetch --depth=1 origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
      - name: Restore completed reviewed numerical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39228347935 --repo skyking882/missile_sim --name missile-sim-relock-timing-reviewed-20261019 --dir delivery
      - name: Verify original delivery, then add report only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('delivery');rows=json.loads((root/'MANIFEST.json').read_text())
          for r in rows:
              p=root/r['path'];assert p.stat().st_size==r['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==r['sha256'],str(p)
          print('ORIGINAL_DELIVERY_HASHES',len(rows))
          shutil.copy2('audits/relock_timing_20261019/RESULTS.md',root/'RESULTS.md')
          (root/'receipts/report-attachment.json').write_text(json.dumps({'verified_existing_files':len(rows),'numerical_results_unchanged':True,'previous_successful_run':39228347935,'scope':'Report-only attachment to already executed and reproduced numerical evidence'},indent=2))
          (root/'README.md').write_text('Start with RESULTS.md for the Chinese mechanism findings and limitations.\n\n'+(root/'README.md').read_text())
          PY
          git rev-parse HEAD > delivery/report-source-commit.txt
      - name: Confirm unchanged production and seal final manifest
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 2954b2fce51ae74849f7b81f1f2692160094df25
          git diff --exit-code 2954b2fce51ae74849f7b81f1f2692160094df25 HEAD -- src tests raw tools
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('delivery');rows=[dict(path=p.relative_to(root).as_posix(),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(root.rglob('*')) if p.is_file() and p!=root/'MANIFEST.json']
          (root/'MANIFEST.json').write_text(json.dumps(rows,indent=2))
          for r in rows:
              p=root/r['path'];assert p.stat().st_size==r['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==r['sha256']
          print('FINAL_PACKAGE',json.dumps({'files':len(rows),'bytes':sum(r['bytes'] for r in rows),'numerical_reproduction':json.loads((root/'receipts/reproduction.json').read_text())}),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: missile-sim-relock-mechanism-20261019
          path: delivery/
          retention-days: 14
          compression-level: 1
