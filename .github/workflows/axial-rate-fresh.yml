name: Axial rate fresh update invariants
on:
  push:
    branches: ['audit/axial-rate-mechanism-20261019']
    paths: ['.github/workflows/axial-rate-fresh.yml','audits/axial_rate_mechanism_20261019/fresh_check.py']
permissions:
  contents: read
  actions: read
jobs:
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact public source without submodules
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/skyking882/missile_sim.git
          git -c submodule.recurse=false fetch --depth=1 origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
      - name: Restore fixed original-state evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39263363711 --repo skyking882/missile_sim --name missile-sim-relock-gate-memory-reviewed-20261019 --dir memory
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-numpy python3-scipy
      - name: Check source-adjacent fresh pairs and production update identity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          mkdir receipts
          /usr/bin/python3 -u audits/axial_rate_mechanism_20261019/fresh_check.py --memory memory --out fresh-results 2>&1 | tee receipts/fresh.log
          git rev-parse HEAD > receipts/source-commit.txt
          git fetch --depth=1 origin ab93a013dbe5ed8010e3f925a4bcbc1fa83d6f8d
          git diff --exit-code ab93a013dbe5ed8010e3f925a4bcbc1fa83d6f8d HEAD -- src tests data config
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: axial-rate-fresh-invariants-20261019
          path: |
            fresh-results/
            receipts/
            audits/axial_rate_mechanism_20261019/
          retention-days: 14
          compression-level: 1
