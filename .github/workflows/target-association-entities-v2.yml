name: Target association verified entity evidence
on:
  push:
    branches: ['audit/target-association-20261018']
    paths: ['.github/workflows/target-association-entities-v2.yml','audits/target_association_20261018/export_entities.py']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore exact prior Linux parser and unit references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39055559128 --repo skyking882/missile_sim --name psvs-linux-derived-9f28aeb --dir old-native
          echo 'f420444b96802d05fc6877b988e50e8c088f124b703556d9540db15f26ac5999  old-native/PyReplayParser.cpython-312-x86_64-linux-gnu.so' | sha256sum -c -
      - run: sudo apt-get update -qq && sudo apt-get install -y libunwind8 liblzma5
      - name: Read original WRPL and verify all nonempty old unit histories
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir evidence
          python3 tools/verify_bundle.py > evidence/bundle-before.json
          /usr/bin/python3 audits/target_association_20261018/export_entities.py 2026.10.08_12.11.04 --module old-native --out evidence/2026.10.08_12.11.04
          /usr/bin/python3 audits/target_association_20261018/export_entities.py 2026.10.08_12.45.12 --module old-native --out evidence/2026.10.08_12.45.12
          python3 tools/verify_bundle.py > evidence/bundle-after.json
          cp audits/target_association_20261018/export_entities.py evidence/
          git rev-parse HEAD > evidence/source-commit.txt
      - name: Retain fixed countermeasure data as contextual definitions, not replay-version proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/datamine
          for name in countermeasure_split_launcher_jet countermeasure_split_launcher_jet_only_chaff_large countermeasure_large_split_launcher_jet; do
            gh api "repos/gszabi99/War-Thunder-Datamine/contents/aces.vromfs.bin_u/gamedata/weapons/rocketguns/$name.blkx?ref=4ac255b829a27346b9300fccdc138362c2535fbe" --jq '.content' | base64 -d > "evidence/datamine/$name.blkx"
          done
          echo 4ac255b829a27346b9300fccdc138362c2535fbe > evidence/datamine/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: target-association-verified-entities-20261018
          path: evidence/
          retention-days: 14
          compression-level: 1
