name: Axial rate mechanism audit
on:
  push:
    branches: ['audit/axial-rate-mechanism-20261019']
    paths: ['.github/workflows/axial-rate-mechanism.yml','audits/axial_rate_mechanism_20261019/analyze.py']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact public source without submodules
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/skyking882/missile_sim.git
          git -c submodule.recurse=false fetch --depth=1 origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
      - name: Restore two completed original-state archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39263363711 --repo skyking882/missile_sim --name missile-sim-relock-gate-memory-reviewed-20261019 --dir memory
          gh run download 39141115762 --repo skyking882/missile_sim --name missile-sim-offaxis-state-reviewed-20261018 --dir offaxis
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-numpy python3-scipy
      - name: Run preregistered discriminants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          mkdir receipts
          /usr/bin/python3 -m py_compile audits/axial_rate_mechanism_20261019/analyze.py
          /usr/bin/python3 -u audits/axial_rate_mechanism_20261019/analyze.py --memory memory --offaxis offaxis --out results 2>&1 | tee receipts/analysis.log
          git rev-parse HEAD > receipts/source-commit.txt
          git fetch --depth=1 origin ab93a013dbe5ed8010e3f925a4bcbc1fa83d6f8d
          git diff --exit-code ab93a013dbe5ed8010e3f925a4bcbc1fa83d6f8d HEAD -- src tests data config
      - name: Preserve bounded re-execution inputs
        if: success()
        run: |
          mkdir -p bounded
          cp memory/input/episodes.json.gz bounded/
          find offaxis -name capture_events.json.gz -print -quit | xargs -I{} cp '{}' bounded/capture_events.json.gz
          cp memory/input/anchors.json.gz bounded/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('bounded')
          rows=[dict(path=p.name,bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(root.iterdir()) if p.is_file()]
          (root/'MANIFEST.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: axial-rate-mechanism-20261019
          path: |
            results/
            receipts/
            bounded/
            audits/axial_rate_mechanism_20261019/
          retention-days: 14
          compression-level: 1
