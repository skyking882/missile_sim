[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aim120a-local-model"
version = "1.2.1"
description = "Reconstructed Python missile dynamics and IR/ARH/PD-SARH scene simulation candidate"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aim120_model.reconstructed" = ["data/*.json", "data/raw/*.blk", "data/infrared/*.json", "data/profiles/*.json"]
"missile_gui" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
